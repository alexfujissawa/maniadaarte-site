name: Publicador Automático do Blog (Seg e Qui - 06h Japão)

on:
  schedule:
    # 06:15 da manhã no Japão (JST / UTC+9) nas Segundas e Quintas-feiras
    # Equivale a 21:15 UTC nos Domingos e Quartas-feiras (minuto 15 evita descarte/atraso por pico de servidores no GitHub)
    - cron: '15 21 * * 0,3'
  workflow_dispatch: # Permite testar clicando em "Run workflow" no GitHub

permissions:
  contents: write

jobs:
  publicar-artigo:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🤖 Executar Agente de Conteúdo Mania da Arte
        run: node scripts/blog-agent.js --auto

      - name: 🔍 Auditar e Auto-Corrigir Artigos (Anti-Clichês & Protocolo)
        run: node scripts/audit-posts.js

      - name: 🚀 Commit e Push do Novo Artigo para a Vercel
        run: |
          git config --global user.name "Equipe Mania da Arte"
          git config --global user.email "bot@maniadaarte.digital"
          git add src/content/blog/ public/images/
          if git diff --staged --quiet; then
            echo "Nenhum novo post pendente."
          else
            git commit -m "chore(blog): publicação agendada automática (Seg/Qui)"
            git push origin main
          fi
